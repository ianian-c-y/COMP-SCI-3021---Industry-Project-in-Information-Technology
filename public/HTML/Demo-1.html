<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap 5 Side Navigation Bar</title>
    <style>
        * {
            margin     : 0;
            padding    : 0;
            box-sizing : border-box;
            }

        body {
            min-height       : 100vh;
            background-color : #fff;
            }

        .side-navbar {
            width            : 250px;
            height           : 100%;
            position         : fixed;
            margin-left      : -300px;
            background-color : #100901;
            transition       : 0.5s;
            }

        .nav-link:active,
        .nav-link:focus,
        .nav-link:hover {
            background-color : #ffffff26;
            }

        .my-container {
            transition : 0.4s;
            }

        .active-nav {
            margin-left : 0;
            }

        /* for main section */
        .active-cont {
            margin-left : 250px;
            }

        #menu-btn {
            background-color : #100901;
            color            : #fff;
            margin-left      : -62px;
            }

        .my-container input {
            border-radius : 2rem;
            padding       : 2px 20px;
            }
    </style>
</head>
<body>
    <!-- bootstrap 5 css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <!-- BOX ICONS CSS-->
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css" rel="stylesheet">
    <!-- Side-Nav -->
    <div class="side-navbar d-flex justify-content-between flex-wrap flex-column" id="sidebar">
        <ul class="nav flex-column text-white w-100">
            <a href="#" class="nav-link h3 text-white my-2">Responsive<br>SideBar Nav</a>
            <li href="#" class="nav-link">
                <i class="bx bxs-dashboard"></i>
                <span class="mx-2">Home</span>
            </li>
            <li href="#" class="nav-link">
                <i class="bx bx-user-check"></i>
                <span class="mx-2">Profile</span>
            </li>
            <li href="#" class="nav-link">
                <i class="bx bx-conversation"></i>
                <span class="mx-2">Contact</span>
            </li>
        </ul>
        <span href="#" class="nav-link h4 w-100 mb-5">
      <a href=""><i class="bx bxl-instagram-alt text-white"></i></a>
      <a href=""><i class="bx bxl-twitter px-2 text-white"></i></a>
      <a href=""><i class="bx bxl-facebook text-white"></i></a>
    </span>
    </div>
    <!-- Main Wrapper -->
    <div class="my-container">
        <!-- Top Nav -->
        <nav class="navbar top-navbar navbar-light bg-light px-5">
            <a class="btn border-0" id="menu-btn"><i class="bx bx-menu">
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 254.395 254.59">
                    <g>
                        <rect height="254.59" opacity="0" width="254.395" x="0" y="0"/>
                        <path d="M254.395 127.246C254.395 197.266 197.266 254.395 127.148 254.395C57.1289 254.395 0 197.266 0 127.246C0 57.1289 57.1289 0 127.148 0C197.266 0 254.395 57.1289 254.395 127.246ZM59.7656 112.305C59.7656 141.504 83.7891 165.43 112.988 165.43C123.73 165.43 133.789 162.012 142.188 156.445L176.758 191.016C179.199 193.555 181.543 194.629 184.961 194.629C190.43 194.629 194.238 190.527 194.238 184.863C194.238 182.227 192.969 179.785 191.016 177.832L156.25 142.871C162.402 134.277 166.113 123.73 166.113 112.305C166.113 82.9102 142.285 58.9844 112.988 58.9844C83.7891 58.9844 59.7656 83.0078 59.7656 112.305ZM150.781 112.207C150.781 132.91 133.789 150.098 112.988 150.098C92.1875 150.098 75.0977 132.91 75.0977 112.207C75.0977 91.5039 92.1875 74.3164 112.988 74.3164C133.789 74.3164 150.781 91.4062 150.781 112.207Z" fill="black" fill-opacity="0.85"/>
                    </g>
                </svg>

            </i></a>
        </nav>
        <!--End Top Nav -->
        <h3 class="text-dark p-3">RESPONSIVE SIDEBAR NAV 💻 📱</h3>
        <p class="px-3">Responsive navigation sidebar built using <a class="text-dark" href="https://getbootstrap.com/">Bootstrap 5</a>.</p>
        <p class="px-3"><a href="https://github.com/harshitjain-hj" class="text-dark">Checkout my Github</a></p>
    </div>
    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js" integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous"></script>
    <script id="rendered-js">
        var menu_btn = document.querySelector("#menu-btn");
        var sidebar = document.querySelector("#sidebar");
        var container = document.querySelector(".my-container");
        menu_btn.addEventListener("click", () => {
            sidebar.classList.toggle("active-nav");
            container.classList.toggle("active-cont");
        });
    </script>
</body>

</html>
